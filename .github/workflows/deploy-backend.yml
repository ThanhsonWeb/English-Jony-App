name: Backend tests and gated production deployment

on:
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "client/app/**/dialogue/_data/**"
      - "client/app/_lib/dialogue/localization.js"
      - "client/scripts/config/**"
      - ".github/workflows/deploy-backend.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/app/**/dialogue/_data/**"
      - "client/app/_lib/dialogue/localization.js"
      - "client/scripts/config/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studyjony-backend-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the verified backend Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Install test dependencies from the lockfile
        working-directory: server
        run: npm ci --engine-strict --no-audit --no-fund
      - name: Run every backend test on disposable MongoDB
        working-directory: server
        run: node --test --test-concurrency=1 tests/*.test.js
      - name: Verify catalogue and syntax
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          npm run dialogue:catalogue:check
          node --check app.js
          node --check server.js
          find controllers middleware models routes services utils scripts -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          git diff --exit-code
      - name: Package the tested source only
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/studyjony-release"
          mkdir -p "$destination"
          node server/scripts/release-artifact.js build "$GITHUB_SHA" "$destination/release.json"
          cp server/scripts/release-artifact.js server/scripts/check-deployment.js server/deploy/ecosystem.config.cjs "$destination/"
      - name: Keep the tested artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-${{ github.sha }}
          path: ${{ runner.temp }}/studyjony-release/
          if-no-files-found: error
          retention-days: 7

  deploy:
    # Phase 2 candidate: the workflow stays manually disabled until operator activation.
    # PRs, forks, tags, failed tests and other events cannot enter production approval.
    if: ${{ github.repository == 'ThanhsonWeb/English-Jony-App' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.test.result == 'success' }}
    needs: test
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      DEPLOY_HEALTH_URL: ${{ vars.VPS_HEALTH_URL }}
    steps:
      - name: Refuse deployment outside main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the verified backend Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Download this run's tested source
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: backend-${{ github.sha }}
          path: ${{ runner.temp }}/studyjony-release
      - name: Refuse an approval for an outdated main revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          (async () => {
            const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/main`;
            const response = await fetch(url, { signal: AbortSignal.timeout(10000), headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json'
            } });
            if (!response.ok || (await response.json()).object?.sha !== process.env.GITHUB_SHA) {
              throw new Error('Main changed while awaiting approval. Run and approve tests for the new revision.');
            }
          })().catch(() => { console.error('Current-main revision check failed; no deployment attempted.'); process.exitCode = 1; });
          NODE
      - name: Validate pinned SSH identity and non-root account
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST_KEY_SHA256: ${{ secrets.VPS_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_KEY:?Missing SSH private key}"
          : "${VPS_KNOWN_HOSTS:?Missing independently verified host key}"
          : "${VPS_HOST_KEY_SHA256:?Missing independently verified fingerprint}"
          [[ "$VPS_USER" == studyjony ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$VPS_PORT" =~ ^[1-9][0-9]{0,4}$ ]]
          (( 10#$VPS_PORT <= 65535 ))
          node server/scripts/check-deployment.js --health-url
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P '' -f "$HOME/.ssh/id_ed25519" > /dev/null
          host_lookup="$VPS_HOST"
          if (( 10#$VPS_PORT != 22 )); then host_lookup="[$VPS_HOST]:$VPS_PORT"; fi
          ssh-keygen -F "$host_lookup" -f "$HOME/.ssh/known_hosts" > "$RUNNER_TEMP/matched-host-key"
          fingerprints=$(ssh-keygen -lf "$RUNNER_TEMP/matched-host-key" -E sha256 | awk '{print $2}')
          [[ "$fingerprints" == "$VPS_HOST_KEY_SHA256" ]]
      - name: Upload and deploy the isolated release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          incoming="/var/www/studyjony/incoming/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          destination="$RUNNER_TEMP/studyjony-release"
          checksum=$(cat "$destination/release.json.sha256")
          [[ "$checksum" =~ ^[a-f0-9]{64}$ ]]
          options=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UpdateHostKeys=no
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o ConnectTimeout=15
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          ssh "${options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -m 700 -- '$incoming'"
          scp "${options[@]}" -P "$VPS_PORT" "$destination/release.json" "$destination/release-artifact.js" \
            "$destination/check-deployment.js" "$destination/ecosystem.config.cjs" "$VPS_USER@$VPS_HOST:$incoming/"
          ssh "${options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$GITHUB_SHA' '$incoming' '$checksum' '$DEPLOY_HEALTH_URL'" < server/scripts/deploy-backend.sh
      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/matched-host-key"
