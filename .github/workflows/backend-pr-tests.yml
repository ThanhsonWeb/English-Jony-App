name: Backend PR tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22.23.2
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Install backend dependencies
        run: npm ci --engine-strict --no-audit --no-fund
      - name: Run all backend tests on disposable MongoDB
        run: node --test --test-concurrency=1 tests/*.test.js
      - name: Validate Dialogue and Story catalogue
        run: npm run dialogue:catalogue:check
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check server.js
          find controllers middleware models routes services utils scripts deploy \
            -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) \
            -print0 | xargs -0 -r -n 1 node --check
